name: Build CI Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: true
        type: string
      fingerprint:
        description: Fingerprint of the CI image build configuration.
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/optmstpessmst/bpp2-build
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.image_tag == 'main' }}
          labels: |
            org.opencontainers.image.revision={{sha}}
            io.bpp2.ci-image.fingerprint=${{ inputs.fingerprint }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bpp2-ci-image-${{ inputs.fingerprint }}
          cache-to: type=gha,mode=max,scope=bpp2-ci-image-${{ inputs.fingerprint }}