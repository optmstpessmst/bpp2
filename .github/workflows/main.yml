name: Deploy Astro to Cloudflare Workers

# stolen from https://docs.astro.build/en/guides/deploy/github/
on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Monolith
        run: cargo install monolith --version 2.11.7 --locked
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Astro
        run: npm run build
        
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
